<div aria-hidden="true" style="position: absolute; left: 760px; top: 200px; width: 1px; height: 520px; background: #E5E7EB"></div>

<footer style="position: absolute; right: 80px; bottom: 40px; font-size: 12px; color: #5B6472">BUA Senior Staff Multipurpose Cooperative Society</footer>
</div>
