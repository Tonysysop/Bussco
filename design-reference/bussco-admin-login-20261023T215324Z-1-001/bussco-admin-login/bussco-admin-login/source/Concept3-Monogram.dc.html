<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F2937}a:hover{color:#75141A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F8F9FB; font-family: 'Manrope', system-ui, sans-serif; color: #1F2937">

<div aria-hidden="true" style="position: absolute; left: 70px; top: -200px; width: 1300px; height: 1300px; opacity: 0.075; pointer-events: none">
<dc-import name="Mark" size="1300" tone="mono" hint-size="1300px,1300px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 450px; height: 1px; background: rgba(158,27,34,0.08)"></div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 720px; width: 1px; background: rgba(158,27,34,0.08)"></div>

<header style="position: absolute; left: 56px; right: 56px; top: 40px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.32em; color: #75141A">BUSSCO</span>
<span style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: #5B6472">ADMINISTRATIVE PORTAL</span>
</header>

<form style="position: absolute; left: 510px; top: 150px; width: 420px; box-sizing: border-box; padding: 40px 36px 32px; background: rgba(255,255,255,0.94); backdrop-filter: blur(6px); border: 1px solid #E5E7EB; border-radius: 20px; box-shadow: 0 1px 2px rgba(31,41,55,0.04), 0 40px 80px -40px rgba(31,41,55,0.25); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; margin-bottom: 6px">
<p style="margin: 0; font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; color: #9E1B22">BUSSCO ADMINISTRATION</p>
<h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.025em">Welcome Back</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Sign in to access your administrative workspace.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c3-email" style="font-size: 13px; font-weight: 600">Corporate Email Address</label>
<input id="c3-email" type="text" placeholder="name@company.com" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D1D5DB; border-radius: 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c3-pw" style="font-size: 13px; font-weight: 600">Password</label>
<div style="position: relative">
<input id="c3-pw" type="password" style="height: 48px; width: 100%; box-sizing: border-box; padding: 0 56px 0 16px; border: 1px solid #D1D5DB; border-radius: 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
<button type="button" aria-label="Show password" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: #5B6472; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c0-1.5 3.5-7 9-7s9 5.5 9 7-3.5 7-9 7-9-5.5-9-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<button type="button" style="margin-top: 6px; height: 52px; border: 0; border-radius: 999px; background: #9E1B22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 600">Sign In to Admin Portal<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
<a href="#member-portal" style="align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Return to Member Portal</a>
</form>

<p style="position: absolute; left: 0; right: 0; bottom: 40px; margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #5B6472"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Restricted access. Authorized administrators only.</p>
</div>
</x-dc>

</html>
